name: Release

# Publie une archive téléchargeable à chaque tag « vX.Y.Z ».
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version à publier, sans le v (ex. 0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Déterminer la version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "TINYMDEDIT_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Version : $VERSION"

      - name: Banc d'essai
        run: ./test.sh

      - name: Compilation
        env:
          TINYMDEDIT_BUILD: ${{ github.run_number }}
          # Renseigner ce secret le jour où un certificat Developer ID existe :
          # build.sh signera alors pour de bon au lieu de signer en ad-hoc.
          TINYMDEDIT_SIGN_IDENTITY: ${{ secrets.SIGN_IDENTITY }}
        run: ./build.sh

      - name: Archiver
        run: |
          # ditto plutôt que zip : c'est le seul à préserver les métadonnées et
          # la signature d'un bundle macOS.
          ditto -c -k --keepParent \
            "build/TinyMDEdit.app" "TinyMDEdit-${TINYMDEDIT_VERSION}.zip"
          shasum -a 256 "TinyMDEdit-${TINYMDEDIT_VERSION}.zip" | tee empreinte.txt

      - name: Publier
        uses: softprops/action-gh-release@v2
        with:
          files: TinyMDEdit-*.zip
          generate_release_notes: true
          body: |
            ## Installation

            **Par Homebrew** — installation et mises à jour en une commande :

            ```sh
            brew tap CedricHalenria/tap
            brew trust CedricHalenria/tap
            brew install --cask tinymdedit
            ```

            **Par téléchargement direct** — décompressez l'archive et glissez
            **TinyMDEdit.app** dans `/Applications`.

            ### Premier lancement

            Quelle que soit la voie choisie, Homebrew comprise, macOS refusera
            d'ouvrir l'app : elle n'est pas encore signée par un certificat Apple
            payant. Allez dans **Réglages Système → Confidentialité et sécurité**,
            puis cliquez sur **Ouvrir quand même**. C'est à faire une seule fois.
